name: mbrecordingtools
description: Plugin Flutter pour l'enregistrement audio en arrière-plan avec transcription Whisper GGML et analyse waveform.
version: 1.1.0+1
homepage: https://ricochets.dev

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio recording
  record: ^7.1.1
  record_linux: ^2.1.1

  # Background service
  flutter_background_service: ^5.1.0

  # Local notifications
  flutter_local_notifications: ^22.2.0

  # Device info for RAM detection
  device_info_plus: ^13.2.0

  # Path provider
  path_provider: ^2.1.6

  # UUID for file naming
  uuid: ^4.6.0

  # Whisper GGML for speech-to-text
  whisper_ggml: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


